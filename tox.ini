[tox]
requires =
  tox>=4
envlist =
  py3{13,14,15}-{latest,min}
  notebooks
skip_missing_interpreters = true

# Configuration that allows us to split tests across GitHub runners effectively
[gh-actions]
python =
  3.13: py313
  3.14: py314
  3.15: py315

[gh-actions:env]
DEPENDS =
  latest: latest
  min: min

[testenv]
description =
  !min: Pytest with coverage
  min: Pytest with coverage, at the lowest versions the dependencies allow
labels = test
pass_env =
  # getpass.getuser() sources for Windows:
  LOGNAME
  USER
  LNAME
  USERNAME
  # Pass user color preferences through
  PY_COLORS
  FORCE_COLOR
  NO_COLOR
  CLICOLOR
  CLICOLOR_FORCE
  CURBRANCH
  GITHUB_ACTIONS
  TEST_DATA_HOME
  TEST_OUTPUT_DIR
  TEST_WORK_DIR
  DIPY_HOME
  NIFREEZE_PHANTOMS
  PYTHONHASHSEED
  PYTEST_ADDOPTS
  ITK_GLOBAL_DEFAULT_NUMBER_OF_THREADS
  PATH
  NIFREEZE_WERRORS
extras = elastix, test
uv_resolution =
  min: lowest-direct
commands =
  pytest -sv --doctest-modules --cov nifreeze --cov-report xml --durations=25 \
  --junitxml=test-results.xml -v src test {posargs:-n auto}
  # A wall-clock speedup needs the CPUs to itself: the suite's xdist workers skip it (#747)
  pytest -sv test/test_model_dmri.py::test_dki_parallel_speedup

[testenv:notebooks]
description = Run notebooks
labels = notebooks
pass_env =
  # getpass.getuser() sources for Windows:
  LOGNAME
  USER
  LNAME
  USERNAME
  # Pass user color preferences through
  PY_COLORS
  FORCE_COLOR
  NO_COLOR
  CLICOLOR
  CLICOLOR_FORCE
  CURBRANCH
  GITHUB_ACTIONS
  TEST_DATA_HOME
  TEST_OUTPUT_DIR
  TEST_WORK_DIR
  PYTHONHASHSEED
  ITK_GLOBAL_DEFAULT_NUMBER_OF_THREADS
  PATH
extras = test, notebooks
commands =
   # pytest --nbmake docs/notebooks/*.ipynb
   # not working due to https://github.com/tox-dev/tox/issues/1571
   python {toxinidir}/tools/run_notebooks.py

[testenv:gallery]
description = Generate the prediction gallery (coverage manifest + executed notebooks)
labels = gallery
pass_env =
  LOGNAME
  USER
  LNAME
  USERNAME
  PY_COLORS
  FORCE_COLOR
  NO_COLOR
  CLICOLOR
  CLICOLOR_FORCE
  CURBRANCH
  GITHUB_ACTIONS
  DIPY_HOME
  NIFREEZE_GALLERY_DATA
  NIFREEZE_GALLERY_OUT
  PYTHONHASHSEED
  PATH
extras = gallery
commands =
  python {toxinidir}/tools/run_gallery.py

[testenv:docs]
description = Build documentation site
labels = docs
allowlist_externals = make
extras = doc
commands =
  make -C docs/ SPHINXOPTS="-W -v" BUILDDIR="$HOME/docs" OUTDIR="${CURBRANCH:-html}" html

[testenv:typecheck]
description = Run mypy type checking
labels = check
deps =
  mypy
  microsoft-python-type-stubs @ git+https://github.com/microsoft/python-type-stubs.git
extras = types
commands =
  mypy .

[testenv:spellcheck]
description = Check spelling
labels = check
deps =
  codespell[toml]
skip_install = true
commands =
  codespell . {posargs}

[testenv:build{,-strict}]
labels =
  check
  pre-release
deps =
  build
  twine
skip_install = true
set_env =
  build-strict: PYTHONWARNINGS=error
commands =
  python -m build
  python -m twine check dist/*

[testenv:publish]
depends = build
labels = release
deps =
  twine
skip_install = true
commands =
  python -m twine upload dist/*
