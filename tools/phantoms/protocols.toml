# Acquisition protocols reproduced by the synthetic reference dataset (#548).
#
# Each table is protocols/<name>.b: one "x y z b" row per volume, unit vectors in
# world (RAS) coordinates as prescribed, b in s/mm². fetch_protocols.py rebuilds
# them from the sources below (`--check` compares). Matrices list the readout,
# phase-encoding and slice axes; phase_encoding names the world axis of the
# phase-encoding direction. SNR is the mean white-matter b=0 signal over the
# standard deviation of the noise in each real or imaginary channel.

