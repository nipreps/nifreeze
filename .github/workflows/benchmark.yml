name: Benchmark

on:
  push:
    branches: ['main', 'maint/*']
  pull_request:
    branches: ['main', 'maint/*']
  workflow_dispatch:

defaults:
  run:
    shell: bash

# Cancel superseded runs of a pull request; never those of a push, each of which
# records the results of its own commit
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  ASV_CONFIG: benchmarks/asv.conf.json
  ASV_MACHINE: gha
  # One BLAS/OpenMP thread, so CPU time is not inflated by spinning threads
  OPENBLAS_NUM_THREADS: 1
  MKL_NUM_THREADS: 1
  OMP_NUM_THREADS: 1

jobs:
  compare:
    name: Compare with main
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Determine the commits
      run: |
        # HEAD is the pull request merged into the tip of its base branch, so
        # the comparison measures exactly what merging would change
        echo "TARGET=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
        echo "BASE=$(git rev-parse HEAD^1)" >> "$GITHUB_ENV"

    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[benchmark] pytest

    - name: Test the report
      run: python -m pytest -p no:cacheprovider benchmarks/tests

    - name: Benchmark both commits
      run: |
        asv machine --yes --config "$ASV_CONFIG" --machine "$ASV_MACHINE"
        printf '%s\n' "$TARGET" "$BASE" > commits.txt
        # Both commits run in this job, alternating rounds (ABBA). The report
        # below decides what fails the job, including benchmarks that crash.
        asv run --config "$ASV_CONFIG" --machine "$ASV_MACHINE" --show-stderr \
          --interleave-rounds --record-samples "HASHFILE:commits.txt" \
          || echo "::warning::asv run exited with status $?"

    - name: Report
      run: |
        python benchmarks/report.py --machine "$ASV_MACHINE" \
          --base "$BASE" --target "$TARGET" \
          --summary "$GITHUB_STEP_SUMMARY" --output benchmarks/report.txt

    - name: Upload the results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: benchmark-results-${{ github.sha }}
        path: |
          benchmarks/results
          benchmarks/report.txt
        compression-level: 9

  record:
    name: Record
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[benchmark]

    - name: Benchmark
      run: |
        asv machine --yes --config "$ASV_CONFIG" --machine "$ASV_MACHINE"
        asv run --config "$ASV_CONFIG" --machine "$ASV_MACHINE" --show-stderr \
          "$GITHUB_SHA^!" || echo "::warning::asv run exited with status $?"

    - name: Upload the results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: benchmark-results-${{ github.sha }}
        path: benchmarks/results
        compression-level: 9

    - name: Report
      run: |
        python benchmarks/report.py --machine "$ASV_MACHINE" --target "$GITHUB_SHA" \
          --summary "$GITHUB_STEP_SUMMARY"
