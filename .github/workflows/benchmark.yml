name: Benchmark

on:
  push:
    branches: ['main', 'maint/*']
  # Only pull requests that change what the comparison measures (the package and its
  # dependencies) or what it runs (the suite, the phantom fixture, ANTs) (#685)
  pull_request:
    branches: ['main', 'maint/*']
    paths:
      - 'src/**'
      - 'pyproject.toml'
      - 'benchmarks/**'
      - 'tools/phantoms/**'
      - '.github/actions/**'
      - '.github/workflows/benchmark.yml'
  # Record a range of commits, e.g. to fill the dashboard's history
  workflow_dispatch:
    inputs:
      commits:
        description: 'ASV range of commits to record, e.g. "HEAD~20..HEAD" (default: the selected commit)'
        required: false
        default: ''

defaults:
  run:
    shell: bash

# Cancel superseded runs of a pull request; never those of a push, each of which
# records the results of its own commit
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  ASV_CONFIG: benchmarks/asv.conf.json
  ASV_MACHINE: gha
  # One BLAS/OpenMP thread, so CPU time is not inflated by spinning threads
  OPENBLAS_NUM_THREADS: 1
  MKL_NUM_THREADS: 1
  OMP_NUM_THREADS: 1

jobs:
  compare:
    name: Compare with main
    # Skipped on pull requests that only change documentation (#611)
    if: >-
      github.event_name == 'pull_request'
      && !(startsWith(github.head_ref, 'doc/') || startsWith(github.head_ref, 'docs/')
      || startsWith(github.event.pull_request.title, 'DOC:'))
    # ubuntu-latest (26.04) has no Miniconda to install ANTs from (#638)
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Determine the commits
      run: |
        # HEAD is the pull request merged into the tip of its base branch, so
        # the comparison measures exactly what merging would change
        echo "TARGET=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
        echo "BASE=$(git rev-parse HEAD^1)" >> "$GITHUB_ENV"

    - uses: actions/setup-python@v6
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[benchmark] pytest

    - name: Test the report
      run: python -m pytest -p no:cacheprovider benchmarks/tests

    # The registration benchmarks run conda-forge's ANTs
    - name: Install ANTs
      uses: ./.github/actions/ants

    # The quality benchmarks analyze the CI phantom
    - uses: ./.github/actions/phantom-fixtures

    - name: Benchmark both commits
      run: |
        export PATH="$PATH:$ANTSPATH"
        asv machine --yes --config "$ASV_CONFIG" --machine "$ASV_MACHINE"
        # ASV reads the file relative to the directory of its configuration
        printf '%s\n' "$TARGET" "$BASE" > "$RUNNER_TEMP/commits.txt"
        # Both commits run in this job, alternating rounds (ABBA). The report
        # below decides what fails the job, including benchmarks that crash.
        asv run --config "$ASV_CONFIG" --machine "$ASV_MACHINE" --show-stderr \
          --interleave-rounds --record-samples "HASHFILE:$RUNNER_TEMP/commits.txt" \
          || echo "::warning::asv run exited with status $?"

    - name: Report
      run: |
        python benchmarks/report.py --machine "$ASV_MACHINE" \
          --base "$BASE" --target "$TARGET" \
          --summary "$GITHUB_STEP_SUMMARY" --output benchmarks/report.txt

    - name: Upload the results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: benchmark-results-${{ github.sha }}
        path: |
          benchmarks/results
          benchmarks/report.txt
        compression-level: 9

  record:
    name: Record
    if: github.event_name != 'pull_request'
    # ubuntu-latest (26.04) has no Miniconda to install ANTs from (#638)
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - uses: actions/setup-python@v6
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[benchmark]

    # The registration benchmarks run conda-forge's ANTs
    - name: Install ANTs
      uses: ./.github/actions/ants

    - uses: ./.github/actions/phantom-fixtures

    - name: Benchmark
      env:
        COMMITS: ${{ inputs.commits }}
      run: |
        export PATH="$PATH:$ANTSPATH"
        asv machine --yes --config "$ASV_CONFIG" --machine "$ASV_MACHINE"
        if [[ -n "$COMMITS" ]]; then
          # Skip the commits the dashboard already has
          git restore --source origin/gh-pages --worktree benchmarks/results 2>/dev/null || true
          asv run --config "$ASV_CONFIG" --machine "$ASV_MACHINE" --show-stderr \
            --skip-existing-commits "$COMMITS" || echo "::warning::asv run exited with status $?"
        else
          asv run --config "$ASV_CONFIG" --machine "$ASV_MACHINE" --show-stderr \
            "$GITHUB_SHA^!" || echo "::warning::asv run exited with status $?"
        fi

    - name: Upload the results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: benchmark-results-${{ github.sha }}
        path: benchmarks/results
        compression-level: 9

    - name: Report
      run: |
        python benchmarks/report.py --machine "$ASV_MACHINE" --target "$GITHUB_SHA" \
          --summary "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Publish the dashboard
    needs: record
    # Publish even when a benchmark failed, so the dashboard shows the gap
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.record.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    # The docs deploy also pushes to gh-pages, into other directories: a deploy that
    # loses the race starts again from the new tip (.github/actions/gh-pages-deploy)
    concurrency:
      group: benchmark-dashboard
      cancel-in-progress: false

    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - uses: actions/setup-python@v6
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[benchmark]

    - uses: actions/download-artifact@v8
      with:
        name: benchmark-results-${{ github.sha }}
        path: new-results

    - name: Build the dashboard and push it to gh-pages
      uses: ./.github/actions/gh-pages-deploy
      with:
        message: 'benchmarks: publish the results of ${{ github.sha }}'
        apply: |
          # The results published so far, plus this run's
          rm -rf benchmarks/results && mkdir -p benchmarks/results
          if [[ -d "$SITE/benchmarks/results" ]]; then
            cp -r "$SITE/benchmarks/results/." benchmarks/results/
          fi
          cp -r new-results/. benchmarks/results/

          # ``asv publish`` empties its output directory, so the raw results are
          # copied back in afterwards
          asv publish --config "$ASV_CONFIG" --html-dir "$SITE/benchmarks"
          cp -r benchmarks/results "$SITE/benchmarks/results"
