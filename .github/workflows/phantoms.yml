name: Synthetic phantoms

on:
  push:
    branches: ['main', 'maint/*']
    paths:
      - 'tools/phantoms/**'
      - 'src/nifreeze/testing/phantoms.py'
      - '.github/actions/phantom-fixtures/**'
      - '.github/workflows/phantoms.yml'
  pull_request:
    branches: ['main', 'maint/*']
    paths:
      - 'tools/phantoms/**'
      - 'src/nifreeze/testing/phantoms.py'
      - '.github/actions/phantom-fixtures/**'
      - '.github/workflows/phantoms.yml'
  workflow_dispatch:

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fixture:
    name: Simulate the CI dataset
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/phantom-fixtures
      - name: List the dataset
        run: find "$NIFREEZE_PHANTOMS" -type f | sort

  verify:
    name: Verify what the perturbed copies rely on
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: tools/phantoms/phantom.py.lock
          cache-suffix: phantoms
      - name: Verify
        run: uv run tools/phantoms/phantom.py verify
