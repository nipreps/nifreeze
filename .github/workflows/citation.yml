name: Check CITATION.cff

on:
  push:
    branches: ['main']
    paths:
      - CITATION.cff
  pull_request:
    branches: ['main']
    paths:
      - CITATION.cff
  workflow_dispatch:

jobs:
  validate-citation-cff:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate CITATION.cff
        uses: dieghernan/cff-validator@v5
