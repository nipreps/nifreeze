# Affine registration, for eddy currents (until #591's B-spline), started from the
# rigid estimate.
# A section per backend, read by the backend of that name
# (nifreeze.registration.base.load_config). To change a setting, copy and edit this file.

# ANTs (antsRegistration, run through nipype).
ants:
  collapse_output_transforms: true
  convergence_threshold: [1.0e-06, 1.0e-07]
  convergence_window_size: [15, 5]
  dimension: 3
  initialize_transforms_per_stage: false
  interpolation: Linear
  metric: [Mattes, GC]
  metric_weight: [1.0, 1.0]
  number_of_iterations:
  - [100]
  - [50]
  radius_or_number_of_bins: [32, 5]
  sampling_percentage: [0.2, 0.1]
  sampling_strategy: [Regular, Random]
  shrink_factors:
  - [1]
  - [1]
  sigma_units: [vox, vox]
  smoothing_sigmas:
  - [2.0]
  - [0.0]
  transform_parameters:
  - [0.01]
  - [0.001]
  transforms: [Affine, Affine]
  use_histogram_matching: [true, true]
  winsorize_lower_quantile: 0.0001
  winsorize_upper_quantile: 0.9998
  write_composite_transform: false

# Elastix: ANTs' stages mapped directly (#670), tested against the phantom truth (#672).
elastix:
  winsorize_lower_quantile: 0.0001
  winsorize_upper_quantile: 0.9998
  use_histogram_matching: true
  stages:
  - smoothing_sigma: 2.0
    parameters:
      Registration: [MultiResolutionRegistration]
      NumberOfResolutions: ['1']
      FixedImagePyramid: [FixedGenericImagePyramid]
      MovingImagePyramid: [MovingGenericImagePyramid]
      ImagePyramidRescaleSchedule: ['1', '1', '1']
      Transform: [AffineTransform]
      AutomaticTransformInitialization: ['false']
      AutomaticScalesEstimation: ['true']
      HowToCombineTransforms: [Compose]
      Metric: [AdvancedMattesMutualInformation]
      NumberOfHistogramBins: ['32']
      Interpolator: [LinearInterpolator]
      ImageSampler: [Grid]
      SampleGridSpacing: ['5', '1', '1']
      NewSamplesEveryIteration: ['false']
      ErodeMask: ['false']
      Optimizer: [AdaptiveStochasticGradientDescent]
      AutomaticParameterEstimation: ['true']
      MaximumNumberOfIterations: ['100']
      WriteResultImage: ['false']
  - sampling_percentage: 0.1
    shrink_factor: 1
    smoothing_sigma: 0.0
    parameters:
      Registration: [MultiResolutionRegistration]
      NumberOfResolutions: ['1']
      FixedImagePyramid: [FixedGenericImagePyramid]
      MovingImagePyramid: [MovingGenericImagePyramid]
      ImagePyramidRescaleSchedule: ['1', '1', '1']
      Transform: [AffineTransform]
      AutomaticTransformInitialization: ['false']
      AutomaticScalesEstimation: ['true']
      HowToCombineTransforms: [Compose]
      Metric: [AdvancedNormalizedCorrelation]
      Interpolator: [LinearInterpolator]
      ImageSampler: [RandomCoordinate]
      NewSamplesEveryIteration: ['true']
      ErodeMask: ['false']
      Optimizer: [AdaptiveStochasticGradientDescent]
      AutomaticParameterEstimation: ['true']
      MaximumNumberOfIterations: ['50']
      WriteResultImage: ['false']

# ITK's registration framework (#730): the ANTs stages above (also ITK's framework),
# with head motion and a field along phase encoding estimated together (9 parameters)
# when `restrict: phase-encoding`; a full affine without it. The optimizer is ITK's
# regular-step gradient descent, whose steps are set on phantoms (#723).
# With `motion: fixed` too, the head motion stays as the start gives it, and only the
# field is estimated (3 parameters, #736); the default is `motion: refine`.
itk:
  winsorize_lower_quantile: 0.0001
  winsorize_upper_quantile: 0.9998
  use_histogram_matching: false
  restrict: phase-encoding
  stages:
  - metric: mattes
    bins: 32
    sampling: regular
    sampling_percentage: 0.2
    smoothing_sigma: 1.0
    shrink_factor: 2
    iterations: 100
    learning_rate: 0.5
    relaxation: 0.8
    minimum_step: 0.00001
  - metric: correlation
    sampling: random
    samples: 17000
    smoothing_sigma: 0.0
    shrink_factor: 1
    iterations: 50
    learning_rate: 0.1
    relaxation: 0.8
    minimum_step: 0.00001

# GEM, the global eddy model (#745), compared where each volume was acquired (#776): its
# stages are ITK's metrics, summed over the volumes and minimized by L-BFGS-B, so ITK's
# optimizer and its step settings do not run. No stage smooths the images: each volume
# as acquired is smoothed once with the cubic B-spline, and the points sit at voxel
# centres, so it is read exactly.
gem:
  winsorize_lower_quantile: 0.0001
  winsorize_upper_quantile: 0.9998
  use_histogram_matching: false
  stages:
  - metric: mattes
    bins: 32
    sampling: regular
    sampling_percentage: 0.2
    shrink_factor: 2
    iterations: 100
  - metric: correlation
    sampling: random
    samples: 17000
    shrink_factor: 1
    iterations: 50
