[build-system]
requires = ["hatchling", "hatch-vcs", "nipreps-versions"]
build-backend = "hatchling.build"


[project]
name = "nifreeze"
description = "A flexible framework for volume-to-volume artifact estimation and correction across multiple 4D neuroimaging modalities (diffusion MRI, functional MRI, and PET)."
readme = "README.rst"
authors = [{name = "The NiPreps Developers", email = "nipreps@gmail.com"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Image Recognition",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
license = "Apache-2.0"
license-files = ["LICEN[CS]E*"]
requires-python = ">=3.13"
dependencies = [
  "attrs>=24.3.0",
  "dipy>=1.12.1",
  "h5py>=3.13.0",
  "joblib>=1.5.0",
  "matplotlib>=3.11",
  "nibabel>=5.3.3",
  "nipype>=1.11.0,<2.0",
  "nitransforms>=25.0.0",
  "nireports>=24.0.3",
  "numpy>=2.3.0",
  "pandas>=2.3.0",
  "pyyaml>=6.0.3",
  "scikit-image>=0.26.0",
  "scikit-learn>=1.7.0",
  "scipy>=1.15.0",
  "tqdm>=4.67.1",
  "typing-extensions>=4.13.0",
]
dynamic = ["version"]

[project.urls]
Documentation = "https://www.nipreps.org/nifreeze"
Home = "https://github.com/nipreps/nifreeze"
NiPreps = "https://www.nipreps.org/"

[project.optional-dependencies]
doc = [
  "furo>=2025.7.19",
  "nbsphinx>=0.9.6",
  "packaging>=25.0",
  "pydot>=3.0.3",
  "pydotplus",
  "sphinx>=4.5,<8",
  "sphinx-argparse>=0.6.0",
  "sphinx-rtd-theme>=3.1.0",
  "sphinxcontrib-apidoc>=0.6.0",
  "sphinxcontrib-napoleon",
  "sphinxcontrib-versioning",
  "sphinx-argparse>=0.6.0",
  "sphinxcontrib-bibtex>=2.6.4",
]
dev = [
  "ruff>=0.7.4",
  "pre-commit>=4.1.0",
  "pre-commit-hooks>=6.0.0",
]
elastix = ["itk-elastix>=0.25.4"]
plotting = ["nilearn>=0.11.0"]
resmon = ["psutil>=6.1.1"]
test = [
  "coverage>=7.6.6",
  "ipykernel>=6.30.0",
  "mriqc-learn",
  "pytest>=8.3.4",
  "pytest-cov>=6.1.0",
  "pytest-env>=1.2.0",
  "pytest-xdist>=3.7.0"
]
types = [
  "pandas-stubs>=2.2.3.241126",
  "types-setuptools>=75.5.0.20241116",
  "scipy-stubs>=1.14.1.4",
  "types-attrs",
  "types-PyYAML>=6.0.12.20241221",
  "types-tqdm>=4.67.0.20241119",
  "pytest>=8.3.4",
]
notebooks = [
  "jupyter",
  "nbclient>=0.10.1",
  "nbmake>=1.5.5",
  "mriqc-learn",
  "nest-asyncio>=1.5.1",
  "nipreps-synthstrip",
]
antsopt = [
  "ConfigSpace>=1.2.1",
  "nipreps",
  "scikit-image>=0.26.0",
  "smac>=2.3.0",
]
benchmark = [
  "asv==0.6.6",
  "psutil>=6.1.1",
  "threadpoolctl>=3.6.0",
  "virtualenv==20.38.0",
]
gallery = [
  "coverage>=7.6.6",
  "datalad>=1.1.4",
  "datalad-next>=1.6.0",
  "nilearn>=0.11.0",
]

# Aliases
docs = ["nifreeze[doc]"]
tests = ["nifreeze[test]"]
all = ["nifreeze[antsopt,benchmark,dev,doc,elastix,gallery,notebooks,plotting,resmon,test,types]"]

[project.scripts]
nifreeze = "nifreeze.cli.run:main"

#
# Hatch configurations
#

[tool.hatch.build.targets.sdist]
exclude = [
  ".git_archival.txt",  # No longer needed in sdist
  "/.dockerignore",
  "/.gitattributes",
  "/.github",
  "/.mailmap",
  "/.maint",
  "/.pre-commit-config.yaml",
  "/.wiki",
  "/.zenodo.json",
  "/AGENTS.md",
  "/CLAUDE.md",
  "/CONTRIBUTING.md",
  "/benchmarks",
  "/docs",
  "/scripts",
  "/test/test_gallery.py",  # Tests docs/sphinxext/gallery, not shipped
  "/tools",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nifreeze"]
# exclude = [
#   "nifreeze/tests/data",  # Large test data directory
# ]

[tool.hatch.version]
validate-bump = true
source = "vcs"

[tool.hatch.version.raw-options]
version_scheme = "nipreps-calver"
local_scheme = "no-local-version"

[tool.hatch.build.hooks.vcs]
version-file = "src/nifreeze/_version.py"

#
# Developer tool configurations
#

[tool.mypy]
check_untyped_defs = true
# The prediction-gallery package lives under docs/ (docs tooling, not shipped).
mypy_path = "docs/sphinxext"
# Environments and dashboards that asv builds when the benchmarks run locally
exclude = ["^benchmarks/env/", "^benchmarks/html/"]

[[tool.mypy.overrides]]
module = [
  "IPython.*",
  "nipype.*",
  "nilearn.*",
  "nireports.*",
  "nitransforms.*",
  "seaborn",
  "dipy.*",
  "smac.*",
  "joblib",
  "h5py",
  "ConfigSpace",
  "scipy.*",
  "sklearn.*",
  "skimage.*",
  "pandas",
  "attrs",
  "psutil",
  "trxscan.*",
]
ignore_missing_imports = true

[tool.ruff]
line-length = 99
target-version = "py313"
exclude = [
  ".eggs",
  ".git",
  ".hg",
  ".mypy_cache",
  ".tox",
  ".venv",
  "venv",
  "_build",
  "build",
  "dist",
]

[tool.ruff.lint]
select = [
  "F",
  "E",
  "C",
  "W",
  "B",
  "I",
  "ICN",
]
ignore = [
  "E203"
]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"

[tool.ruff.lint.extend-per-file-ignores]
"*/__init__.py" = ["F401"]
".maint/update_authors.py" = ["C901"]
"docs/conf.py" = ["E265", "E402"]
"/^\\s*\\.\\. _.*?: http/" = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.flake8-import-conventions.extend-aliases]
"nibabel" = "nb"

[tool.ruff.lint.isort]
known-first-party=["nifreeze"]

[tool.pytest.ini_options]
pythonpath = "src/ test/ docs/sphinxext/"
norecursedirs = [".*", "_*"]
addopts = "-v --doctest-modules -m 'not e2e'"
doctest_optionflags = "ALLOW_UNICODE NORMALIZE_WHITESPACE ELLIPSIS"
env = "PYTHONHASHSEED=0"
markers = [
  "random_base_data: Custom marker for random base data tests",
  "random_bval_data: Custom marker for random b-val data tests",
  "random_bvec_data: Custom marker for random b-vec data tests",
  "random_gtab_data: Custom marker for random gtab data tests",
  "random_dwi_data: Custom marker for random dwi data tests",
  "random_pet_data: Custom marker for random pet data tests",
  "random_uniform_ndim_data: Custom marker for random multi-dimensional data tests",
  "random_uniform_spatial_data: Custom marker for random spatial data tests",
  "memory: Opt-in peak-RSS memory tests (heavier fixtures; run explicitly with -m memory)",
  "e2e: Opt-in end-to-end tests on simulated motion (need ANTs; run explicitly with -m e2e)",
  "slow: Exhaustive grids of cases; CI deselects them on pull requests and pushes, and runs them weekly",
]
filterwarnings = [
  "ignore::DeprecationWarning",
  # DIPY
  "ignore:Updating b0_threshold to.*:UserWarning",
  # scikit-learn
  "ignore:The optimal value found for dimension.*:sklearn.exceptions.ConvergenceWarning",
  # GIN's nfHDF5 files are of version 1, whose gradient tables are read as RAS+B (#642)
  "ignore:.*/dwi(_motion)?\\.h5 is an nfHDF5 file of version 1,:UserWarning",
]

[tool.coverage.run]
branch = true
parallel = true
concurrency = ["multiprocessing"]
omit = [
  "^test/*",
  "*/conftest.py",
  "src/nifreeze/_version.py"
]

[tool.coverage.report]
# Regexes for lines to exclude from consideration
exclude_lines = [
  "raise NotImplementedError",
  "warnings\\.warn",
]

[tool.codespell]
# nd - import scipy.ndimage as nd
# mapp, reson -- Mapp. and Reson. abbreviations in citation
ignore-words-list = "nd,mapp,reson"
skip = """
./.git,./docs/gallery,*.pdf,*.svg,*.min.js,*.ipynb"""
